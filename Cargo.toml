[package]
name = "piarre"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
futures-util = "0.3"
rig-agent = "=0.46.0"
rig-core = { version = "=0.46.0", features = ["reqwest"] }
rustyline = { version = "=19.0.0", default-features = false }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
