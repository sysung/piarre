models:
  chat:
    model: &minicpm hf.co/openbmb/MiniCPM5-2B-GGUF:Q4_K_M
    context_size: 4096

services:
  harness: &harness
    build: .
    image: piarre-harness:local
    environment:
      PIARRE_ENDPOINT: http://model-runner.docker.internal/engines/llama.cpp/v1
      PIARRE_MODEL: *minicpm
    models: [chat]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    tmpfs:
      - /tmp:size=16777216,mode=1777

  workspace:
    <<: *harness
    profiles: [workspace]
    working_dir: /workspace
    command: ["--workspace", "/workspace"]
    volumes:
      - type: bind
        # Compose interpolates inactive services too. Use an impossible path when unset.
        source: "${PIARRE_HOST_WORKSPACE:-/dev/null/PIARRE_HOST_WORKSPACE-required}"
        target: /workspace
        bind:
          create_host_path: false
