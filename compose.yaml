services:
  harness:
    build: .
    image: piarre-harness:local
    environment:
      PIARRE_ENDPOINT: ${PIARRE_ENDPOINT:-http://model-runner.docker.internal/engines/llama.cpp/v1}
      PIARRE_MODEL: ${PIARRE_MODEL:-piarre/minicpm5:2b-q4_k_m}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    tmpfs:
      - /tmp:size=16777216,mode=1777
      - /workspace:size=67108864,uid=10001,gid=10001,mode=0700
